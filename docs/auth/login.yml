swagger: "2.0"

tags:
  - Auth

parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

responses:
  200:
    description: Login successful, returns access token and user info
  400:
    description: JSON missing or invalid
  401:
    description: Invalid credentials
